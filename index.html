<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>QR Drop</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--fg:#e8eaf0;--mut:#8b93a5;--acc:#4f8cff;--ok:#3ccf8e;--warn:#f5a524}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:980px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.on::before{background:var(--ok)} .status.off::before{background:#e5484d}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
#qr{background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:center;min-height:250px;align-items:center;color:#333}
#qr img,#qr svg{width:100%;height:auto;image-rendering:pixelated}
.hint{color:var(--mut);font-size:12.5px;margin:10px 0 0}
.btn{appearance:none;border:1px solid var(--line);background:#222733;color:var(--fg);padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)} .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px} .btn:disabled{opacity:.45;cursor:not-allowed}
textarea,input[type=text],input[type=url]{width:100%;background:#11141a;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:12px}
.drop.over{border-color:var(--acc);color:var(--fg);background:#1b2233}
ul.list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;background:#13161c;border:1px solid var(--line);border-radius:10px;padding:10px}
.item .tag{font-size:11px;color:var(--mut);white-space:nowrap;padding-top:2px;min-width:52px}
.item.in .tag{color:var(--ok)} .item.out .tag{color:var(--acc)}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;word-break:break-all} .item .meta{color:var(--mut);font-size:12px}
.item pre.text{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;max-height:160px;overflow:auto}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thumb{max-width:100%;max-height:180px;border-radius:8px;display:block;margin-bottom:6px}
.bar{height:5px;background:#222733;border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.done{color:var(--ok);font-size:12.5px}
.empty{color:var(--mut);text-align:center;padding:14px}
.setup{max-width:560px;margin:40px auto}
.code{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);word-break:break-all}
</style>
<style>
  .wrap{padding:14px} .card{margin-bottom:12px}
  .big{display:block;width:100%;padding:16px;font-size:16px;text-align:center;margin-bottom:8px}
</style></head>
<body><div class="wrap">
  <header><h1>📲 QR Drop</h1><span id="status" class="status">Connecting…</span></header>

  <div class="card">
    <label class="btn primary big">📷 Send photos / videos<input id="media" type="file" accept="image/*,video/*" multiple hidden></label>
    <label class="btn big">📁 Send files<input id="files" type="file" multiple hidden></label>
    <textarea id="text" placeholder="Type or paste text to send to your computer…"></textarea>
    <div class="row"><button id="sendText" class="btn primary">Send text</button></div>
  </div>

  <div class="card">
    <b>Transfers</b>
    <ul id="list" class="list"><li class="empty">Files and text from your computer appear here. Tap <b>Save</b> to download.</li></ul>
  </div>
  <p class="hint">Keep this page open while transferring. End-to-end encrypted. Only your computer can read what you send.</p>
</div>
<script>
// QR Drop transport: end-to-end encrypted, works on any network.
// - Control messages (hello, text, file announcements) go through ntfy.sh.
// - File bodies stream through ppng.io (a piping server: it relays bytes live and stores nothing).
// Everything is AES-GCM encrypted with a key that only exists inside the QR code's #hash,
// which browsers never send to any server. The relays only ever see ciphertext.
(function (g) {
  const NTFY = 'ntfy.sh', PIPE = 'https://ppng.io/';
  const RECORD = 1 << 20;      // encrypt files in 1 MB records
  const MAX_INLINE_TEXT = 2000; // longer text is sent like a file

  const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = new TextEncoder(), dec = new TextDecoder();

  const importKey = (k) => crypto.subtle.importKey('raw', Uint8Array.from(k.match(/../g), (h) => parseInt(h, 16)), 'AES-GCM', false, ['encrypt', 'decrypt']);
  async function seal(key, u8) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, u8));
    const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12); return o;
  }
  const unseal = async (key, u8) => new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(0, 12) }, key, u8.subarray(12)));

  const pipeBytes = async (u8, t) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(t)).arrayBuffer());
  const zip = (u8) => pipeBytes(u8, new CompressionStream('deflate-raw'));
  const unzip = (u8) => pipeBytes(u8, new DecompressionStream('deflate-raw'));

  // ---------- direct (peer-to-peer) path ----------
  const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
  const CHUNK = 64 * 1024, HIGH_WATER = 8 * 1024 * 1024;
  function iceDone(pc) {
    return new Promise((r) => {
      if (pc.iceGatheringState === 'complete') return r();
      const t = setTimeout(r, 2500);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } });
    });
  }

  async function encryptFile(key, file) {
    const parts = [];
    for (let off = 0; off < file.size || (off === 0 && parts.length === 0); off += RECORD) {
      const r = await seal(key, new Uint8Array(await file.slice(off, off + RECORD).arrayBuffer()));
      const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, r.length);
      parts.push(len, r);
      if (file.size === 0) break;
    }
    return new Blob(parts);
  }

  function upload(path, blob, onProg) {
    return new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open('POST', PIPE + path);
      x.upload.onprogress = (e) => e.total && onProg && onProg(e.loaded / e.total);
      x.onload = () => (x.status < 300 ? res() : rej(new Error('upload ' + x.status)));
      x.onerror = () => rej(new Error('upload failed'));
      x.send(blob);
    });
  }

  async function download(key, path, size, onProg) {
    const r = await fetch(PIPE + path);
    if (!r.ok) throw new Error('download ' + r.status);
    const rd = r.body.getReader();
    const out = []; let pend = [], pendLen = 0, got = 0;
    const take = (n) => { // pull n bytes off the pending queue
      const b = new Uint8Array(n); let o = 0;
      while (o < n) { const c = pend[0], k = Math.min(c.length, n - o); b.set(c.subarray(0, k), o); o += k; if (k === c.length) pend.shift(); else pend[0] = c.subarray(k); }
      pendLen -= n; return b;
    };
    let need = 0;
    for (;;) {
      const { done, value } = await rd.read();
      if (value) { pend.push(value); pendLen += value.length; }
      for (;;) {
        if (!need) { if (pendLen < 4) break; need = new DataView(take(4).buffer).getUint32(0); }
        if (pendLen < need) break;
        const pt = await unseal(key, take(need)); need = 0;
        out.push(pt); got += pt.length; onProg && onProg(size ? got / size : 1);
      }
      if (done) break;
    }
    return out;
  }

  // role: 'pc' or 'phone'. h: { onConnected(), onText(t), onFileStart(id, meta), onProgress(id, p), onFile(id, file), onSendStart(id, file), onSendDone(id), onError(msg) }
  function session(sessionId, keyHex, role, h) {
    const me = hex(6);
    let key, ws, closed = false, connected = false;
    const keyReady = importKey(keyHex).then((k) => (key = k));
    let firstOpen; const ready = new Promise((r) => (firstOpen = r));

    async function post(obj) {
      await keyReady;
      const body = b64(await seal(key, await zip(enc.encode(JSON.stringify({ ...obj, from: me, role })))));
      const r = await fetch('https://' + NTFY + '/' + sessionId, { method: 'POST', body });
      if (!r.ok) throw new Error('signal ' + r.status);
    }
    let dc = null, rpc = null, mode = 'relay';
    const setMode = (m) => { if (mode !== m) { mode = m; h.onMode && h.onMode(m); } };
    function markConnected() {
      if (!connected) { connected = true; h.onConnected && h.onConnected(); h.onMode && h.onMode(mode); }
      if (role === 'phone' && !rpc) startDirect();
    }

    // Phone offers, computer answers; the handshake rides the encrypted relay channel.
    function newPc() {
      try { rpc && rpc.close(); } catch {}
      const pc = (rpc = new RTCPeerConnection({ iceServers: ICE }));
      pc.addEventListener('connectionstatechange', () => {
        if (['failed', 'closed', 'disconnected'].includes(pc.connectionState) && rpc === pc) { dc = null; setMode('relay'); }
      });
      return pc;
    }
    function useChannel(ch) {
      ch.binaryType = 'arraybuffer';
      const incoming = {};
      ch.onopen = () => { dc = ch; setMode('direct'); };
      ch.onclose = () => { if (dc === ch) { dc = null; setMode('relay'); } };
      ch.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const m = JSON.parse(e.data);
          if (m.k === 'text') h.onText && h.onText(m.t);
          else if (m.k === 'meta') { incoming[m.id] = { m, parts: [], got: 0 }; h.onFileStart && h.onFileStart(m.id, m); }
          else if (m.k === 'end') {
            const f = incoming[m.id]; if (!f) return; delete incoming[m.id];
            h.onFile && h.onFile(m.id, new File(f.parts, f.m.name, { type: f.m.type || 'application/octet-stream' }));
          }
        } else {
          const id = dec.decode(new Uint8Array(e.data, 0, 34)); const f = incoming[id]; if (!f) return;
          const d = e.data.slice(34); f.parts.push(d); f.got += d.byteLength;
          h.onProgress && h.onProgress(id, f.m.size ? f.got / f.m.size : 1);
        }
      };
      if (ch.readyState === 'open') ch.onopen();
    }
    async function startDirect() {
      try {
        const pc = newPc();
        useChannel(pc.createDataChannel('qrdrop', { ordered: true }));
        await pc.setLocalDescription(await pc.createOffer());
        await iceDone(pc);
        await post({ k: 'rtc-offer', sdp: pc.localDescription });
      } catch (e) { console.warn('direct failed', e); }
    }
    async function onOffer(sdp) {
      const pc = newPc();
      pc.ondatachannel = (e) => useChannel(e.channel);
      await pc.setRemoteDescription(sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      await iceDone(pc);
      await post({ k: 'rtc-answer', sdp: pc.localDescription });
    }
    async function sendDirect(file, id) {
      const ch = dc;
      ch.send(JSON.stringify({ k: 'meta', id, name: file.name, size: file.size, type: file.type }));
      const head = enc.encode(id);
      for (let off = 0; off < file.size;) {
        const slice = new Uint8Array(await file.slice(off, off + CHUNK * 16).arrayBuffer());
        for (let i = 0; i < slice.length; i += CHUNK) {
          while (ch.bufferedAmount > HIGH_WATER) {
            if (ch.readyState !== 'open') throw new Error('direct link dropped');
            await new Promise((r) => setTimeout(r, 10));
          }
          const part = slice.subarray(i, i + CHUNK), b = new Uint8Array(34 + part.length);
          b.set(head); b.set(part, 34); ch.send(b);
        }
        off += slice.length;
        h.onSendProgress && h.onSendProgress(id, off / file.size);
      }
      ch.send(JSON.stringify({ k: 'end', id }));
    }

    async function handle(m) {
      if (m.from === me || m.role === role) return;
      if (m.k === 'hello') { markConnected(); post({ k: 'here' }); }
      else if (m.k === 'here') markConnected();
      else if (m.k === 'rtc-offer' && role === 'pc') { markConnected(); onOffer(m.sdp).catch((e) => console.warn(e)); }
      else if (m.k === 'rtc-answer' && role === 'phone' && rpc && !rpc.remoteDescription) rpc.setRemoteDescription(m.sdp).catch((e) => console.warn(e));
      else if (m.k === 'bye') { connected = false; dc = null; try { rpc && rpc.close(); } catch {} rpc = null; mode = 'relay'; h.onDisconnected && h.onDisconnected(); }
      else if (m.k === 'text') { markConnected(); h.onText && h.onText(m.t); }
      else if (m.k === 'file') {
        markConnected();
        if (!m.isText) h.onFileStart && h.onFileStart(m.path, m);
        try {
          const parts = await download(key, m.path, m.size, (p) => !m.isText && h.onProgress && h.onProgress(m.path, p));
          if (m.isText) h.onText && h.onText(dec.decode(await new Blob(parts).arrayBuffer()));
          else h.onFile && h.onFile(m.path, new File(parts, m.name, { type: m.type || 'application/octet-stream' }));
        } catch (e) { h.onError && h.onError('Receiving ' + m.name + ' failed: ' + e.message); }
      }
    }

    function sub() {
      ws = new WebSocket('wss://' + NTFY + '/' + sessionId + '/ws');
      ws.onmessage = async (e) => {
        const d = JSON.parse(e.data);
        if (d.event === 'open') { firstOpen(); return; }
        if (d.event !== 'message') return;
        let m; try { await keyReady; m = JSON.parse(dec.decode(await unzip(await unseal(key, unb64(d.message))))); } catch { return; } // not ours
        handle(m);
      };
      ws.onclose = () => { if (!closed) setTimeout(sub, 2000); };
    }
    sub();
    ready.then(() => post({ k: 'hello' }).catch(() => {}));

    let queue = Promise.resolve();
    function sendFile(file, isText) {
      const path = 'qd' + hex(16);
      if (!isText) h.onSendStart && h.onSendStart(path, file);
      queue = queue.then(async () => {
        if (dc && dc.readyState === 'open' && !isText) {
          try { await sendDirect(file, path); h.onSendDone && h.onSendDone(path); return; }
          catch (e) { if (file.size > 0) h.onSendProgress && h.onSendProgress(path, 0); } // fall through to relay
        }
        await post({ k: 'file', path, name: file.name, size: file.size, type: file.type, isText: !!isText });
        const blob = await encryptFile(key, file);
        await upload(path, blob, (p) => !isText && h.onSendProgress && h.onSendProgress(path, p));
        if (!isText) h.onSendDone && h.onSendDone(path);
      }).catch((e) => h.onError && h.onError('Sending ' + file.name + ' failed: ' + e.message));
      return path;
    }
    function sendText(t) {
      if (dc && dc.readyState === 'open' && t.length < 60000) { queue = queue.then(() => dc.send(JSON.stringify({ k: 'text', t }))).catch(() => {}); return; }
      if (t.length > MAX_INLINE_TEXT) return sendFile(new File([t], 'text.txt', { type: 'text/plain' }), true);
      queue = queue.then(() => post({ k: 'text', t })).catch((e) => h.onError && h.onError('Sending text failed: ' + e.message));
    }
    function close() { closed = true; try { navigator.sendBeacon && keyHex && post({ k: 'bye' }); } catch {} try { ws.close(); } catch {} try { rpc && rpc.close(); } catch {} }

    return { ready, sendFile, sendText, close, get connected() { return connected; }, get mode() { return mode; } };
  }

  function fmtSize(b) { const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; }

  g.QRLink = { session, hex };
  g.QRDrop = { fmtSize };
})(window);

// Shared UI helpers for the item list (both extension and phone page).
(function (global) {
  const $ = (s) => document.querySelector(s);
  const items = {};

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function addTextItem(list, text, dir) {
    const li = el('li', 'item ' + dir);
    li.append(el('span', 'tag', dir === 'in' ? '⬇ text' : '⬆ text'));
    const body = el('div', 'body'); const p = el('pre', 'text', text); body.append(p);
    const isUrl = /^https?:\/\/\S+$/.test(text.trim());
    const acts = el('div', 'acts');
    const copy = el('button', 'btn sm', 'Copy');
    copy.onclick = async () => { try { await navigator.clipboard.writeText(text); } catch { const t = el('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); } copy.textContent = 'Copied ✓'; setTimeout(() => (copy.textContent = 'Copy'), 1200); };
    acts.append(copy);
    if (isUrl) { const a = el('a', 'btn sm', 'Open'); a.href = text.trim(); a.target = '_blank'; a.rel = 'noopener'; acts.append(a); }
    li.append(body, acts); list.prepend(li);
  }

  function addFileItem(list, id, meta, dir) {
    const li = el('li', 'item ' + dir);
    li.append(el('span', 'tag', dir === 'in' ? '⬇ file' : '⬆ file'));
    const body = el('div', 'body');
    body.append(el('div', 'name', meta.name), el('div', 'meta', QRDrop.fmtSize(meta.size)));
    const bar = el('div', 'bar'); const fill = el('i'); bar.append(fill); body.append(bar);
    const acts = el('div', 'acts');
    li.append(body, acts); list.prepend(li);
    items[id] = { li, fill, body, acts };
  }

  function progress(id, p) { const it = items[id]; if (it) it.fill.style.width = Math.round(p * 100) + '%'; }

  function finishIncoming(id, file) {
    const it = items[id]; if (!it) return;
    it.li.querySelector('.bar').remove();
    const url = URL.createObjectURL(file);
    if (file.type.startsWith('image/')) { const img = el('img', 'thumb'); img.src = url; it.body.prepend(img); }
    else if (file.type.startsWith('video/')) { const v = el('video', 'thumb'); v.src = url; v.controls = true; v.muted = true; it.body.prepend(v); }
    const a = el('a', 'btn sm primary', 'Save'); a.href = url; a.download = file.name; it.acts.append(a);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      const s = el('button', 'btn sm', 'Share'); s.onclick = () => navigator.share({ files: [file] }).catch(() => {}); it.acts.append(s);
    }
    return a;
  }

  function finishOutgoing(id) { const it = items[id]; if (!it) return; it.li.querySelector('.bar').remove(); it.acts.append(el('span', 'done', 'Sent ✓')); }

  global.QRUI = { $, el, addTextItem, addFileItem, progress, finishIncoming, finishOutgoing };
})(window);
</script>
<script>
const { $, addTextItem, addFileItem, progress, finishIncoming, finishOutgoing } = QRUI;
const target = decodeURIComponent(location.hash.slice(1));
let sess;
function setStatus(t, c) { const s = $('#status'); s.textContent = t; s.className = 'status ' + (c || ''); }
function clearEmpty() { const e = document.querySelector('#list .empty'); if (e) e.remove(); }
function setEnabled(on) { document.querySelectorAll('button, label.btn, input, textarea').forEach((e) => e.toggleAttribute('disabled', !on)); }

function clearEmptyAdd(fn) { return (...a) => { clearEmpty(); fn(...a); }; }
function start() {
  const [id, key] = target.split('.');
  if (!id || !/^[0-9a-f]{32}$/.test(key || '')) { setStatus('No session. Scan the QR code from your computer', 'off'); setEnabled(false); return; }
  setStatus('Connecting to computer…');
  sess = QRLink.session(id, key, 'phone', {
    onConnected: () => setStatus('Connected', 'on'),
    onMode: (m) => setStatus(m === 'direct' ? 'Connected · Direct ⚡' : 'Connected · via relay', 'on'),
    onDisconnected: () => setStatus('Computer closed the session', 'off'),
    onText: clearEmptyAdd((t) => addTextItem($('#list'), t, 'in')),
    onFileStart: clearEmptyAdd((pid, m) => addFileItem($('#list'), pid, m, 'in')),
    onProgress: progress,
    onFile: (pid, file) => finishIncoming(pid, file),
    onSendStart: clearEmptyAdd((pid, f) => addFileItem($('#list'), pid, f, 'out')),
    onSendProgress: progress,
    onSendDone: finishOutgoing,
    onError: clearEmptyAdd((msg) => addTextItem($('#list'), '⚠ ' + msg, 'in')),
  });
  setTimeout(() => { if (!sess.connected) setStatus('Waiting for computer. Is the QR Drop tab open?', 'off'); }, 8000);
}
function sendFiles(list) { for (const f of [...list]) sess.sendFile(f); }
$('#media').onchange = (e) => { sendFiles(e.target.files); e.target.value = ''; };
$('#files').onchange = (e) => { sendFiles(e.target.files); e.target.value = ''; };
$('#sendText').onclick = () => {
  const t = $('#text').value.trim(); if (!t) return;
  sess.sendText(t); clearEmpty(); addTextItem($('#list'), t, 'out'); $('#text').value = '';
};
// Stop the phone from sleeping mid-transfer where supported
if ('wakeLock' in navigator) { const lock = () => navigator.wakeLock.request('screen').catch(() => {}); lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock()); }
start();
</script>
</body></html>
